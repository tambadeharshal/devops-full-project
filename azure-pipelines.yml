trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

# ============================================================
# Node.js
# ============================================================
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'


# ============================================================
# Install dependencies
# ============================================================
- script: |
    cd app
    npm ci
  displayName: 'Install dependencies'


# ============================================================
# Test application
# ============================================================
- script: |
    cd app
    npm start &
    sleep 5
    curl --fail http://localhost:8080/health
  displayName: 'Test application'


# ============================================================
# Docker Build & Push
# ============================================================
- task: Docker@2
  displayName: 'Build and Push Docker Image'
  inputs:
    containerRegistry: 'acr-docker-connection'
    repository: 'devops-calculator'
    command: 'buildAndPush'
    Dockerfile: '**/Dockerfile'
    tags: |
      $(Build.BuildId)
      latest


# ============================================================
# Install Terraform
# ============================================================
- bash: |
    set -e

    TERRAFORM_VERSION="1.9.8"
    TEMP_DIR=$(mktemp -d)

    echo "Installing Terraform ${TERRAFORM_VERSION}..."
    echo "Temporary directory: ${TEMP_DIR}"

    cd "${TEMP_DIR}"

    wget -q https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip

    unzip -o terraform_${TERRAFORM_VERSION}_linux_amd64.zip

    sudo install -m 0755 terraform /usr/local/bin/terraform

    terraform version

    rm -rf "${TEMP_DIR}"
  displayName: 'Install Terraform'


# ============================================================
# Terraform Init
# ============================================================
- task: AzureCLI@2
  displayName: 'Terraform Init'
  inputs:
    azureSubscription: 'azure-terraform-connection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      set -e

      cd terraform

      terraform init -upgrade


# ============================================================
# Terraform Validate
# ============================================================
- task: AzureCLI@2
  displayName: 'Terraform Validate'
  inputs:
    azureSubscription: 'azure-terraform-connection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      set -e

      cd terraform

      terraform validate


# ============================================================
# Import Existing Resource Group
# ============================================================
- task: AzureCLI@2
  displayName: 'Import Existing Resource Group'
  inputs:
    azureSubscription: 'azure-terraform-connection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      set -e

      cd terraform

      SUBSCRIPTION_ID=$(az account show --query id -o tsv)

      RESOURCE_GROUP_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/rg-devops-full-project"

      echo "Checking Terraform state..."

      if terraform state show azurerm_resource_group.devops > /dev/null 2>&1; then
        echo "Resource Group is already in Terraform state."
      else
        echo "Resource Group is not in Terraform state."
        echo "Importing existing Resource Group..."

        terraform import \
          azurerm_resource_group.devops \
          "$RESOURCE_GROUP_ID"
      fi

      echo "Terraform state:"
      terraform state list


# ============================================================
# Terraform Plan
# ============================================================
- task: AzureCLI@2
  displayName: 'Terraform Plan'
  inputs:
    azureSubscription: 'azure-terraform-connection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      set -e

      cd terraform

      terraform plan -out=tfplan


# ============================================================
# Terraform Apply
# ============================================================
- task: AzureCLI@2
  displayName: 'Terraform Apply'
  inputs:
    azureSubscription: 'azure-terraform-connection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      set -e

      cd terraform

      terraform apply -auto-approve tfplan