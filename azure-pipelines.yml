trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

# ============================================================
# 1. Install Node.js
# ============================================================

- task: NodeTool@0
  displayName: 'Install Node.js'
  inputs:
    versionSpec: '20.x'


# ============================================================
# 2. Install dependencies
# ============================================================

- script: |
    set -e
    cd app
    npm ci
  displayName: 'Install dependencies'


# ============================================================
# 3. Test application
# ============================================================

- script: |
    set -e

    cd app

    npm start > app.log 2>&1 &

    echo "Waiting for application..."
    sleep 5

    echo "Testing application..."

    curl --fail http://localhost:8080/health

    echo "Application test successful."

  displayName: 'Test application'


# ============================================================
# 4. Install Terraform
# ============================================================

- bash: |
    set -e

    TERRAFORM_VERSION="1.9.8"
    TEMP_DIR=$(mktemp -d)

    echo "Installing Terraform ${TERRAFORM_VERSION}..."

    cd "${TEMP_DIR}"

    wget -q \
      https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip

    unzip -o terraform_${TERRAFORM_VERSION}_linux_amd64.zip

    sudo install -m 0755 terraform /usr/local/bin/terraform

    terraform version

    rm -rf "${TEMP_DIR}"

  displayName: 'Install Terraform'


# ============================================================
# 5. Terraform Init
# ============================================================

- task: AzureCLI@2
  displayName: 'Terraform Init'
  inputs:
    azureSubscription: 'azure-terraform-connection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      cd terraform

      echo "=========================================="
      echo "Terraform Init"
      echo "=========================================="

      terraform init -upgrade


# ============================================================
# 6. Terraform Validate
# ============================================================

- task: AzureCLI@2
  displayName: 'Terraform Validate'
  inputs:
    azureSubscription: 'azure-terraform-connection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      cd terraform

      echo "=========================================="
      echo "Terraform Validate"
      echo "=========================================="

      terraform validate


# ============================================================
# 7. Terraform Plan
# ============================================================

- task: AzureCLI@2
  displayName: 'Terraform Plan'
  inputs:
    azureSubscription: 'azure-terraform-connection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      cd terraform

      echo "=========================================="
      echo "Terraform Plan"
      echo "=========================================="

      terraform plan -out=tfplan


# ============================================================
# 8. Terraform Apply
# ============================================================

- task: AzureCLI@2
  displayName: 'Terraform Apply'
  inputs:
    azureSubscription: 'azure-terraform-connection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      cd terraform

      echo "=========================================="
      echo "Terraform Apply"
      echo "=========================================="

      terraform apply -auto-approve tfplan

      echo "=========================================="
      echo "Terraform Apply Completed"
      echo "=========================================="


# ============================================================
# 9. Get ACR Login Server
# ============================================================

- task: AzureCLI@2
  displayName: 'Get ACR Login Server'
  inputs:
    azureSubscription: 'azure-terraform-connection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      ACR_NAME="acrdevopsfulltf2026"
      RESOURCE_GROUP="rg-devops-full-project"

      echo "Checking ACR..."

      az acr show \
        --name "$ACR_NAME" \
        --resource-group "$RESOURCE_GROUP" \
        --query "{Name:name,LoginServer:loginServer,ProvisioningState:provisioningState}" \
        --output table


# ============================================================
# 10. Docker Build & Push
# ============================================================

- task: Docker@2
  displayName: 'Build and Push Docker Image'
  inputs:
    containerRegistry: 'acr-docker-connection'
    repository: 'devops-calculator'
    command: 'buildAndPush'
    Dockerfile: '**/Dockerfile'

    tags: |
      $(Build.BuildId)
      latest